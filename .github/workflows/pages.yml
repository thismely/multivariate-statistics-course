name: Verify and deploy course

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    name: Audit, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Prepare course tree
        run: npm run prepare:course

      - name: Audit release tree
        run: python3 scripts/course-audit.py

      - name: Run course-audit tests
        run: python3 -m unittest discover -s tests -p 'test_course_audit.py' -v

      - name: Run JavaScript tests
        run: npm test

      - name: Install course-lab dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Run course-lab tests
        run: python3 -m unittest discover -s tests -p 'test_labs.py' -v

      - name: Build production site
        run: npm run build

      - name: Audit production files
        run: npm run test:dist

      - name: Store verified Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-dist
          path: dist
          if-no-files-found: error

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download verified Pages artifact
        uses: actions/download-artifact@v5
        with:
          name: pages-dist
          path: dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
